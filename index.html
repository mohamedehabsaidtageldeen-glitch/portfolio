<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="" id="md">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style id="tv"></style>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--ff);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
::selection{background:var(--ac);color:var(--on)}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
section{padding:96px 0;scroll-margin-top:60px}
.mono{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;direction:ltr;display:inline-block;color:var(--mu)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.noanim .rv{opacity:1;transform:none;transition:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:calc(var(--r)*.75);font-weight:600;font-size:15px;transition:.25s;border:1px solid transparent;cursor:pointer}
.btn.p{background:var(--ac);color:var(--on)}
.btn.p:hover{transform:translateY(-2px);box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn.g{background:var(--card);border-color:var(--ln)}
.btn.g:hover{border-color:var(--ac);color:var(--ac)}
.sh{margin-bottom:46px;max-width:680px}
.sh h2{font-size:clamp(28px,4vw,46px);line-height:1.2;font-weight:800;letter-spacing:-.02em}
.sh p{color:var(--mu);margin-top:10px;font-size:17px}

/* header */
#hd{position:fixed;top:0;left:0;right:0;z-index:50;transition:.3s}
#hd.sc{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.hi{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.lg{font-weight:800;font-size:19px;letter-spacing:-.02em;direction:ltr}
.lg i{color:var(--ac);font-style:normal}
.nl{display:flex;gap:28px;font-size:15px;font-weight:500;color:var(--mu)}
.nl a:hover{color:var(--tx)}
.hr{display:flex;gap:10px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;background:var(--card)}
.ib:hover{border-color:var(--ac);color:var(--ac)}
.mbt{display:none}
.hcta{padding:9px 20px;font-size:14px}
.mm{display:none;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 24px 18px}
.mm a{padding:12px 0;border-bottom:1px solid var(--ln);font-weight:500}
.mm.open{display:flex}

/* hero */
#hero{padding:150px 0 90px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.av{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);padding:6px 14px;border-radius:99px;font-size:14px;font-weight:500;margin-bottom:22px}
.av i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #22c55e30}
.hn{font-size:clamp(40px,6.4vw,84px);line-height:1.04;font-weight:800;letter-spacing:-.035em}
.hn span{display:block;direction:ltr;text-align:var(--ta)}
.hn.arn span{direction:inherit;text-align:inherit}
.hn .ac{color:var(--ac)}
.ht{font-size:clamp(20px,2.4vw,28px);font-weight:600;margin-top:18px}
.hp{color:var(--mu);font-size:18px;max-width:560px;margin-top:10px}
.hb{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hs{display:flex;gap:36px;flex-wrap:wrap;margin-top:44px;padding-top:26px;border-top:1px solid var(--ln)}
.hs b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.hs span{color:var(--mu);font-size:14px}
.hi2{position:relative;aspect-ratio:4/5;border-radius:calc(var(--r)*1.5);overflow:hidden;background:var(--card);border:1px solid var(--ln)}
.hi2 img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;bottom:16px;inset-inline-start:16px;background:var(--card);border:1px solid var(--ln);padding:6px 14px;border-radius:99px}
.hc{text-align:center}
.hc .hn span{text-align:center;direction:ltr}
.hc .hp{margin-inline:auto}
.hc .hb,.hc .hs{justify-content:center}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:60px}
.strip div{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);background:var(--card)}
.strip img{width:100%;height:100%;object-fit:cover}
.hm .hn{font-size:clamp(48px,9vw,130px)}
.hmr{max-width:700px;margin-top:30px}

/* clients */
.cl{padding:30px 0;border-block:1px solid var(--ln)}
.cl .wrap{display:flex;align-items:center;gap:30px;flex-wrap:wrap;justify-content:space-between}
.cls{display:flex;gap:14px 44px;flex-wrap:wrap;align-items:center}
.cls span{font-weight:800;font-size:20px;color:var(--mu);opacity:.7;letter-spacing:-.02em}

/* works */
.wf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.wf button{padding:8px 20px;border-radius:99px;border:1px solid var(--ln);background:var(--card);font-size:14px;font-weight:500;color:var(--mu);transition:.2s}
.wf button.on,.wf button:hover{background:var(--ac);color:var(--on);border-color:var(--ac)}
.wg.masonry{columns:3;column-gap:22px}
.wg.masonry .wk{break-inside:avoid;margin-bottom:26px}
.wg.grid,.wg.featured{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 22px}
.wg.grid .im,.wg.featured .im{aspect-ratio:4/3}
.wg.grid .im img,.wg.featured .im img{height:100%;object-fit:cover}
.wg.featured .wk:first-child{grid-column:span 2}
.wg.featured .wk:first-child .im{aspect-ratio:2.7/1}
.wk{cursor:pointer}
.wk .im{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--ln)}
.wk img{width:100%;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.wk:hover img{transform:scale(1.04)}
.wk .ov{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.65));opacity:0;transition:.35s;display:flex;align-items:flex-end;padding:18px;color:#fff;font-weight:600;font-size:14px}
.wk:hover .ov{opacity:1}
.fb{position:absolute;top:12px;inset-inline-end:12px;background:var(--ac);color:var(--on);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.wk .mt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px}
.wk h3{font-size:18px;font-weight:700;line-height:1.35}
.wk .mt span{color:var(--mu);font-size:13px;white-space:nowrap}
.wg.list{display:block}
.wg.list .wk{display:grid;grid-template-columns:130px 1fr;gap:22px;align-items:center;border-top:1px solid var(--ln);padding:16px 0}
.wg.list .wk:last-child{border-bottom:1px solid var(--ln)}
.wg.list .im{aspect-ratio:4/3}
.wg.list .im img{height:100%;object-fit:cover}
.wg.list .mt{margin:0;flex-direction:column;gap:2px}
.wg.list h3{font-size:clamp(20px,2.6vw,30px)}
.emp{color:var(--mu);padding:40px 0}

/* cards */
.g4,.g3{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:stretch}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:28px;transition:.3s}
.cd:hover{border-color:var(--ac);transform:translateY(-3px)}
.num{width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:18px}
.cd h3{font-size:20px;font-weight:700;margin-bottom:8px}
.cd p{color:var(--mu);font-size:15px}

/* about */
.ag{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.ap{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--card);border:1px solid var(--ln);position:sticky;top:100px}
.ap img{width:100%;height:100%;object-fit:cover}
.at p{color:var(--mu);font-size:18px;white-space:pre-line;margin-bottom:30px}
.sk{margin-bottom:18px}
.sk div{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;direction:ltr}
.sk i{display:block;height:8px;background:var(--ln);border-radius:9px;overflow:hidden}
.sk u{display:block;height:100%;width:0;background:var(--ac);border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.rv.in .sk u,.noanim .sk u{width:var(--w)}
.ast{display:flex;gap:40px;flex-wrap:wrap;margin-top:36px;padding-top:26px;border-top:1px solid var(--ln)}
.ast b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.ast span{color:var(--mu);font-size:14px}

/* pricing */
.pk{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:32px;transition:.3s}
.pk.pop{border:2px solid var(--ac);transform:translateY(-8px)}
.pb{position:absolute;top:-13px;inset-inline-start:24px;background:var(--ac);color:var(--on);font-size:12px;font-weight:700;padding:3px 14px;border-radius:99px}
.pk h3{font-size:18px;font-weight:700;color:var(--mu)}
.pp{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:8px 0}
.pk>p{color:var(--mu);font-size:15px;margin-bottom:18px}
.pk ul{list-style:none;margin-bottom:26px;flex:1}
.pk li{padding:7px 0;border-top:1px solid var(--ln);font-size:15px;display:flex;gap:10px}
.pk li::before{content:"✓";color:var(--ac);font-weight:800}

/* testimonials + faq */
.tm .q{font-size:17px;line-height:1.8;margin-bottom:22px}
.tm .q::before{content:"“";display:block;font-size:54px;line-height:.6;color:var(--ac);font-family:Georgia,serif;margin-bottom:8px}
.tp{display:flex;align-items:center;gap:12px}
.tp i{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-style:normal;font-weight:800}
.tp b{display:block;line-height:1.3}.tp span{color:var(--mu);font-size:13px}
.fq{max-width:820px}
.fq details{border-top:1px solid var(--ln);padding:20px 0}
.fq details:last-child{border-bottom:1px solid var(--ln)}
.fq summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:20px}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";font-size:24px;color:var(--ac);line-height:1}
.fq details[open] summary::after{content:"–"}
.fq p{color:var(--mu);margin-top:12px}

/* contact */
.ct{display:grid;grid-template-columns:1fr 1fr;gap:50px;background:var(--card);border:1px solid var(--ln);border-radius:calc(var(--r)*1.6);padding:clamp(28px,5vw,60px)}
.ct h2{font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1.2;letter-spacing:-.02em}
.ct>div>p{color:var(--mu);margin:12px 0 26px;font-size:17px}
.cb{display:flex;gap:10px;flex-wrap:wrap}
.so{display:flex;gap:8px 24px;flex-wrap:wrap;margin-top:26px;font-weight:600;font-size:15px}
.so a{color:var(--mu);border-bottom:1px solid transparent}.so a:hover{color:var(--ac);border-color:var(--ac)}
#cf{display:flex;flex-direction:column;gap:12px}
#cf input,#cf textarea{background:var(--bg);border:1px solid var(--ln);border-radius:calc(var(--r)*.7);padding:14px 16px;color:var(--tx);font:inherit;outline:0;transition:.2s;width:100%}
#cf input:focus,#cf textarea:focus{border-color:var(--ac)}
footer{border-top:1px solid var(--ln);padding:26px 0;color:var(--mu);font-size:14px}
.fr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wa{position:fixed;bottom:22px;inset-inline-start:22px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;z-index:60;box-shadow:0 10px 30px #25d36655;transition:.3s}
.wa:hover{transform:scale(1.08)}

/* viewer */
#pv{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;transform:translateY(100%);transition:transform .7s cubic-bezier(.77,0,.18,1);visibility:hidden}
#pv.open{transform:none;visibility:visible}
.pvb{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);z-index:2}
.pvb .btn{padding:8px 18px;font-size:14px}
.pvc{max-width:1100px;margin:auto;padding:56px 24px 30px}
.pvc h1{font-size:clamp(34px,6vw,72px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin-bottom:26px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;border-block:1px solid var(--ln);padding:16px 0;margin-bottom:26px}
.meta small{display:block;color:var(--mu);font-size:12px}
.meta b{font-weight:600}
.tgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tgs span{border:1px solid var(--ln);background:var(--card);padding:3px 14px;border-radius:99px;font-size:13px}
.desc{font-size:18px;color:var(--mu);max-width:740px;white-space:pre-line;margin-bottom:26px}
.ba{position:relative;overflow:hidden;border-radius:var(--r);margin:30px 0 16px;direction:ltr;border:1px solid var(--ln)}
.ba img{width:100%}
.ba .b{position:absolute;inset:0;height:100%;object-fit:cover;clip-path:inset(0 50% 0 0)}
.ba .bl{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 12px #0008;pointer-events:none}
.ba .bl::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:700}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize}
.ba .tg{position:absolute;top:14px;background:#000a;color:#fff;padding:2px 12px;border-radius:99px;font-size:12px;pointer-events:none}
.ba .t1{left:14px}.ba .t2{right:14px}
.imgs img{width:100%;margin-bottom:16px;border-radius:var(--r);border:1px solid var(--ln)}
.nx{display:block;width:100%;text-align:start;background:var(--ac);color:var(--on);padding:46px 24px;margin-top:30px}
.nx small{opacity:.8}
.nx b{display:block;font-size:clamp(26px,4vw,52px);font-weight:800;line-height:1.1;margin-top:4px}

@media(max-width:900px){
 .nl,.hcta{display:none}.mbt{display:grid}
 .hg,.ag,.ct{grid-template-columns:1fr}.hi2{max-width:380px}.ap{position:relative;top:0;max-width:340px}
 .wg.masonry{columns:2}.wg.grid,.wg.featured{grid-template-columns:1fr 1fr}.wg.featured .wk:first-child{grid-column:span 2}
 .pk.pop{transform:none}section{padding:70px 0}#hero{padding-top:110px}
}
@media(max-width:560px){.wg.masonry{columns:1}.wg.grid,.wg.featured{grid-template-columns:1fr}.wg.featured .wk:first-child{grid-column:auto}.wg.featured .wk:first-child .im{aspect-ratio:4/3}.strip{grid-template-columns:1fr}}
</style>
</head>

addEventListener('keydown',e=>{if(!cur)return;if(e.key==='Escape')closeWork();if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const l=visible(),i=l.findIndex(w=>w.id===cur),rtl=T().dir==='rtl',nxt=(e.key==='ArrowLeft')===rtl;openWork(l[(i+(nxt?1:-1)+l.length)%l.length].id)}});
