<style>
:root{--bg:#f3f4f6;--pan:#fff;--ln:#e5e7eb;--tx:#111827;--mu:#6b7280;--ac:#2f5bff;--red:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans','IBM Plex Sans Arabic',sans-serif;font-size:15px;line-height:1.7}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;color:inherit}img{display:block}
#app{display:grid;grid-template-columns:230px 1fr;height:100vh}
#side{background:var(--pan);border-left:1px solid var(--ln);padding:22px 14px;overflow-y:auto}
.brand{font-weight:800;font-size:19px;padding:0 10px;margin-bottom:20px}

#nv button{display:block;width:100%;text-align:right;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:500;color:#374151;font-size:14.5px;margin-bottom:2px}

#wrap{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;gap:10px;align-items:center;padding:12px 22px;background:var(--pan);border-bottom:1px solid var(--ln);flex-wrap:wrap}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}
.dot.on{background:#16a34a}.dot.off{background:var(--red)}
#body{display:flex;flex:1;min-height:0}
#main{flex:1;overflow-y:auto;padding:28px 26px 100px;min-width:0}
#prev{display:none;width:46%;min-width:340px;border-right:1px solid var(--ln);background:#e5e7eb;flex-direction:column}
body.pv #prev{display:flex}
.pvh{display:flex;gap:6px;padding:10px;background:var(--pan);border-bottom:1px solid var(--ln)}
.pvf{flex:1;overflow:auto;display:flex;justify-content:center;padding:0}
.pvf iframe{width:100%;height:100%;border:0;background:#fff}
.pvf.m{padding:14px}.pvf.m iframe{width:390px;height:100%;max-width:100%;border-radius:18px;border:6px solid #111}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.bar h2{font-size:26px;font-weight:700}
.bar small{color:var(--mu);font-weight:500}
.b{display:inline-block;background:var(--pan);border:1px solid #d1d5db;border-radius:10px;padding:8px 16px;font-weight:600;font-size:13.5px;transition:.15s}
.b:hover{border-color:var(--ac);color:var(--ac)}
.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b.p:hover{filter:brightness(1.1);color:#fff}
.b.r{color:var(--red)}.b.r:hover{background:var(--red);color:#fff;border-color:var(--red)}
.b.s{padding:4px 10px;font-size:12.5px;border-radius:8px}
.note{background:#fffbeb;border:1px solid #fcd34d;padding:11px 16px;border-radius:10px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:16px;max-width:860px}
.card>h3{font-size:17px;font-weight:700;margin-bottom:4px}
.card>.sub{color:var(--mu);font-size:13.5px;margin-bottom:16px}
label.f,div.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:14px}

input[type=text],input[type=email],input[type=number],select,textarea{width:100%;margin-top:6px;border:1px solid #d1d5db;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14.5px;background:#fff;outline:0;color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2f5bff22}
textarea{resize:vertical;min-height:80px}
.ck{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-bottom:12px;cursor:pointer}

.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.themes button{border:2px solid var(--ln);border-radius:12px;padding:10px;background:var(--b);text-align:center;font-weight:600;font-size:13px}
.themes button i{display:block;width:26px;height:26px;border-radius:50%;background:var(--c);margin:0 auto 6px}
.themes button.on{border-color:var(--ac);box-shadow:0 0 0 3px #2f5bff30}
.li{border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;background:#fafafa}
.lih{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.rw{display:grid;grid-template-columns:1.1fr 1.2fr auto;gap:10px;align-items:center}

.chk{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}

.quick{display:block;border:2px dashed #cbd5e1;border-radius:14px;padding:20px;text-align:center;color:var(--mu);margin-bottom:16px;cursor:pointer;background:#fff;transition:.2s}
.quick.over,.quick:hover{border-color:var(--ac);color:var(--ac)}
.tools{display:flex;gap:10px;margin-bottom:16px;max-width:520px}.tools input,.tools select{margin:0}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wc{background:var(--pan);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.wc.off{opacity:.5}
.wc>img{width:100%;height:150px;object-fit:cover;background:#eee}
.wi{padding:12px}.wi small{display:block;color:var(--mu);font-size:12.5px}
.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.imgsel{display:flex;gap:14px;align-items:center}.imgsel img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#eee;border:1px solid var(--ln)}

.dz{border:2px dashed #cbd5e1;border-radius:14px;padding:26px;text-align:center;color:var(--mu);cursor:pointer;background:#fff}
.dz.over{border-color:var(--ac);color:var(--ac)}.dz b{color:var(--tx)}

.th .cv{position:absolute;top:6px;right:6px;background:var(--ac);color:#fff;font-size:11px;padding:1px 8px;border-radius:99px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:#111827;color:#fff;padding:10px 22px;border-radius:99px;font-weight:500;z-index:300;transition:transform .4s;font-size:14px}
#toast.show{transform:translate(-50%,0)}
.mu{color:var(--mu)}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{display:flex;overflow-x:auto;padding:8px;border:0}.brand{display:none}#nv{display:flex}#nv button{white-space:nowrap;width:auto}#prev{position:fixed;inset:60px 0 0 0;width:auto;z-index:50}.two,.rw{grid-template-columns:1fr}}
</style>

<script>
const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];

const DB={
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('pf_admin_v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},

 async set(k,v){try{const db=await this.open();return await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}catch(e){return false}}
};

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAL=[['#e9e4da','#1f2937','#2f5bff'],['#1f2937','#e9e4da','#f59e0b'],['#dbeafe','#1e3a8a','#fb7185'],['#fde68a','#111827','#ffffff'],['#d1fae5','#064e3b','#f97316'],['#fce7f3','#831843','#111827']];
function gen(seed,w,h,label){
 const R=rng(seed*977+13),p=PAL[seed%PAL.length],c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.fillStyle=p[0];x.fillRect(0,0,w,h);x.fillStyle=p[1];x.beginPath();x.arc(w*(.3+R()*.4),h*(.32+R()*.3),w*(.2+R()*.14),0,7);x.fill();
 x.fillStyle=p[2];x.fillRect(w*.08,h*(.6+R()*.15),w*(.3+R()*.35),h*.05);x.beginPath();x.arc(w*(.7+R()*.15),h*(.15+R()*.1),w*.06,0,7);x.fill();
 x.fillStyle=p[1];x.font='800 '+Math.round(w*.1)+'px sans-serif';x.fillText(label,w*.08,h*.92);
 return{id:'i_'+uid(),d:c.toDataURL('image/jpeg',.88),s:false}}

 return{updatedAt:0,

  about:'أنا محمد، مصمم جرافيك بشتغل مع عملاء حقيقيين على بوسترات السوشيال ميديا والهويات البصرية، وبطوّر مواقع وأدوات بنفسي. بهتم بالتفاصيل وبالتسليم في ميعاده.\nاكتب هنا نبذة عنك بكلامك.',
  skills:[{n:'Graphic Design',v:90},{n:'Branding',v:75},{n:'Web Development',v:55},{n:'AI Tools',v:85}],stats:[{n:'50+',l:'مشروع'},{n:'15+',l:'عميل'},{n:'3+',l:'سنين خبرة'}]},

 works:sp.map(([c,t,[w,h]],i)=>({id:uid(),title:t,cat:c,year:'2026',client:'عميل تجريبي',desc:'ده عمل تجريبي. امسحه وارفع شغلك الحقيقي.',tags:['Design'],link:'',featured:i===0,ba:false,hidden:false,demo:true,imgs:[gen(i,w,h,'0'+(i+1)),gen(i+3,w,h,'DEMO')]})),
 services:[{t:'بوسترات سوشيال ميديا',d:'تصميمات تلفت الانتباه وتزوّد التفاعل والمبيعات.'},{t:'هوية بصرية',d:'لوجو وألوان وخطوط تخلي براندك مميز ومتّسق.'},{t:'تصميم مواقع',d:'مواقع سريعة وأنيقة بتشتغل على كل الشاشات.'},{t:'محتوى بالذكاء الاصطناعي',d:'صور وإعلانات بتتعمل بأدوات AI بجودة احترافية.'}],
 process:[{t:'نتكلم',d:'بفهم احتياجك وهدفك وجمهورك.'},{t:'أصمم',d:'بقدملك أول تصور واضح خلال أيام.'},{t:'نعدّل',d:'بنظبط التفاصيل لحد ما تبقى راضي.'},{t:'أسلّم',d:'بتستلم كل الملفات جاهزة للاستخدام.'}],

 faq:[{q:'بتاخد وقت قد إيه في التصميم؟',a:'بيختلف حسب المشروع، غالبًا من يومين لأسبوع.'},{q:'ينفع أطلب تعديلات؟',a:'أكيد، وعدد التعديلات حسب الباقة.'},{q:'بتشتغل مع عملاء برا مصر؟',a:'أيوه، وبتواصل بالواتساب أو الإيميل.'}],
 clients:['Brand One','Studio Two','Café Three','Shop Four','Agency Five'],
 socials:[{l:'Instagram',u:'#'},{l:'Facebook',u:'#'},{l:'Behance',u:'#'}]}}
function fix(d){const f=defD();d.settings=Object.assign(f.settings,d.settings||{});const h=d.settings.sections.map(s=>s.id);SECS.forEach(id=>{if(!h.includes(id))d.settings.sections.push({id,on:true,title:''})});d.profile=Object.assign(f.profile,d.profile||{});
 ['cats','works','services','process','packages','testimonials','faq','clients','socials'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=f[k]});return d}

let D,dirH=null,perm=false,TAB='home',T=null,lastSync='';
const catName=id=>(D.cats.find(c=>c.id===id)||{name:'—'}).name;
const allImgs=()=>[D.profile.heroImg,D.profile.aboutImg,...D.works.flatMap(w=>w.imgs)].filter(Boolean);

/* ---------- images ---------- */
function fileToImg(f,max=1600){return new Promise(res=>{if(!f)return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res({id:'i_'+uid(),d:c.toDataURL('image/jpeg',.85),s:false})};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}

/* ---------- publish object ---------- */
function pub(embed){
 const pth=i=>i?(embed?i.d:'images/'+i.id+'.jpg'):'';
 return{...D,demo:undefined,profile:{...D.profile,heroImg:pth(D.profile.heroImg),aboutImg:pth(D.profile.aboutImg)},works:D.works.map(w=>({...w,demo:undefined,imgs:w.imgs.map(pth)}))}}

/* ---------- save / sync / preview ---------- */
let tt,pt;
function touch(){D.updatedAt=Date.now();clearTimeout(tt);tt=setTimeout(()=>{DB.set('data',D);queueSync();pushPrev()},350)}
function commit(msg){D.updatedAt=Date.now();DB.set('data',D);adm();queueSync();pushPrev();if(msg)toast(msg)}
function pushPrev(){if(!document.body.classList.contains('pv'))return;clearTimeout(pt);pt=setTimeout(()=>{const f=$('#pf');if(f&&f.contentWindow)f.contentWindow.postMessage({pf:pub(true)},'*')},200)}
$('#pf').addEventListener('load',()=>pushPrev());

let st2;function queueSync(){if(!dirH||!perm)return;clearTimeout(st2);st2=setTimeout(syncNow,800);$('#st').innerHTML='<span class="dot on"></span> جاري المزامنة...'}
async function syncNow(){
 if(!dirH||!perm)return;
 try{
  const imgDir=await dirH.getDirectoryHandle('images',{create:true}),imgs=allImgs();
  for(const im of imgs)if(!im.s){const fh=await imgDir.getFileHandle(im.id+'.jpg',{create:true}),w=await fh.createWritable();await w.write(await (await fetch(im.d)).blob());await w.close();im.s=true}
  const keep=new Set(imgs.map(i=>i.id+'.jpg')),names=[];for await(const [n] of imgDir.entries())names.push(n);
  for(const n of names)if(/^i_[a-z0-9]+\.jpg$/.test(n)&&!keep.has(n))await imgDir.removeEntry(n);

function fld(label,path,o={}){
 const v=gp(path),h=o.h?`<small>${o.h}</small>`:'';
 if(o.type==='check')return`<label class="ck"><input type="checkbox" data-p="${path}" ${v?'checked':''}> ${label}</label>`;
 if(o.type==='select')return`<label class="f">${label}${h}<select data-p="${path}">${o.opts.map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${n}</option>`).join('')}</select></label>`;
 if(o.type==='color')return`<div class="f">${label}${h}<div class="cr2"><input type="color" data-p="${path}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#2f5bff'}"><button class="b s" data-a="clr" data-p="${path}">رجوع للون الثيم</button></div></div>`;
 if(o.type==='lines')return`<label class="f">${label}${h}<textarea data-p="${path}" data-t="lines" rows="${o.rows||4}">${esc((v||[]).join('\n'))}</textarea></label>`;
 if(o.type==='ta')return`<label class="f">${label}${h}<textarea data-p="${path}" rows="${o.rows||4}">${esc(v)}</textarea></label>`;
 if(o.type==='num')return`<label class="f">${label}${h}<input type="number" data-p="${path}" data-t="num" value="${esc(v)}"></label>`;
 return`<label class="f">${label}${h}<input type="text" data-p="${path}" value="${esc(v)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}></label>`}
const seg=(label,path,opts,h)=>`<div class="f">${label}${h?`<small class="mu" style="display:block;font-weight:400">${h}</small>`:''}<div class="seg">${opts.map(([k,n])=>`<button class="${gp(path)===k?'on':''}" data-a="set" data-p="${path}" data-v="${k}">${n}</button>`).join('')}</div></div>`;
const NEW={services:{t:'',d:''},process:{t:'',d:''},packages:{name:'',price:'',desc:'',features:[],pop:false},testimonials:{name:'',role:'',text:''},faq:{q:'',a:''},socials:{l:'',u:''},'profile.skills':{n:'',v:80},'profile.stats':{n:'',l:''}};
function listEd(title,path,fields,sub){

 else if(a==='cadd'){const v=$('#newcat').value.trim();if(!v)return;D.cats.push({id:'c'+uid(),name:v});commit('اتضاف')}
 else if(a==='set'){sp(p,b.dataset.v);if(p==='settings.theme')D.settings.accent='';commit()}
 else if(a==='clr'){sp(p,'');commit()}
 else if(a==='add'){const arr=gp(p);arr.push(JSON.parse(JSON.stringify(NEW[p])));commit()}
 else if(a==='rm'){gp(p).splice(+b.dataset.i,1);commit()}
 else if(a==='mv'){const arr=gp(p),k=+b.dataset.i,n=k+ +b.dataset.d;if(n>=0&&n<arr.length){[arr[k],arr[n]]=[arr[n],arr[k]];commit()}}
 else if(a==='exjs')dl('data.js','window.PORTFOLIO_DATA='+JSON.stringify(pub(true))+';','text/javascript');
 else if(a==='exjson')dl('portfolio-backup.json',JSON.stringify(D),'application/json');
 else if(a==='reset'){if(confirm('هيمسح كل حاجة. متأكد؟')){D=fix({});D.works=[];allImgs().forEach(i=>i.s=false);commit('اتمسح كل حاجة')}}
});

/* ---------- work editor ---------- */
function closeEd(){const e=$('#ed');if(e)e.remove();T=null}
function editWork(id){
 const ex=D.works.find(w=>w.id===id);
 T=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),title:'',cat:(D.cats[0]||{}).id||'',year:String(new Date().getFullYear()),client:'',desc:'',tags:[],link:'',featured:false,ba:false,hidden:false,imgs:[]};
 const d=document.createElement('div');d.id='ed';
 d.innerHTML=`<div class="box"><div class="bar"><h2>${ex?'تعديل عمل':'عمل جديد'}</h2><button class="b" id="edx">✕ إلغاء</button></div>
 <label class="f">اسم العمل<input type="text" id="e_t" value="${esc(T.title)}"></label>
 <div class="two"><label class="f">القسم<select id="e_c">${D.cats.map(c=>`<option value="${c.id}" ${c.id===T.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="f">السنة<input type="text" id="e_y" value="${esc(T.year)}"></label></div>
 <div class="two"><label class="f">العميل (اختياري)<input type="text" id="e_cl" value="${esc(T.client)}"></label><label class="f">لينك المشروع (اختياري)<input type="text" id="e_l" value="${esc(T.link)}" placeholder="https://"></label></div>
 <label class="f">تاجات<small>افصل بينهم بفاصلة: Logo, Branding</small><input type="text" id="e_tg" value="${esc((T.tags||[]).join(', '))}"></label>
 <label class="f">وصف العمل (اختياري)<textarea id="e_d">${esc(T.desc)}</textarea></label>
 <label class="ck"><input type="checkbox" id="e_f" ${T.featured?'checked':''}> عمل مميّز ★</label>
 <label class="ck"><input type="checkbox" id="e_b" ${T.ba?'checked':''}> أول صورة = "قبل" وتاني صورة = "بعد" (سلايدر مقارنة)</label>
 <div class="dz" id="dz"><b>اسحب الصور هنا</b> أو دوس لاختيارها<br><small>أول صورة هي الغلاف</small><input type="file" id="e_fi" accept="image/*" multiple hidden></div>
 <div class="th" id="th"></div><div class="row" style="margin-top:20px"><button class="b p" id="e_s">حفظ العمل</button></div></div>`;
 document.body.append(d);drawTh();$('#edx').onclick=closeEd;
 const dz=$('#dz'),fi=$('#e_fi');dz.onclick=()=>fi.click();fi.onchange=()=>addFiles(fi.files);
 ['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
 ['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
 dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
 $('#th').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i,k=b.dataset.k,m=T.imgs;
  if(k==='x')m.splice(i,1);else if(k==='c'&&i>0)m.unshift(m.splice(i,1)[0]);else if(k==='l'&&i>0)[m[i-1],m[i]]=[m[i],m[i-1]];else if(k==='r'&&i<m.length-1)[m[i+1],m[i]]=[m[i],m[i+1]];drawTh()};
 $('#e_s').onclick=()=>{
  T.title=$('#e_t').value.trim();T.cat=$('#e_c').value;T.year=$('#e_y').value.trim();T.client=$('#e_cl').value.trim();T.link=$('#e_l').value.trim();
  T.tags=$('#e_tg').value.split(',').map(x=>x.trim()).filter(Boolean);T.desc=$('#e_d').value.trim();T.featured=$('#e_f').checked;T.ba=$('#e_b').checked;
  if(!T.title)return toast('اكتب اسم العمل');if(!T.imgs.length)return toast('ضيف صورة واحدة على الأقل');if(T.ba&&T.imgs.length<2)return toast('سلايدر قبل/بعد محتاج صورتين على الأقل');
  delete T.demo;const i=D.works.findIndex(w=>w.id===T.id);if(i>=0)D.works[i]=T;else D.works.unshift(T);
  closeEd();commit('اتحفظ العمل ✓')};
}
async function addFiles(fl){toast('جاري تجهيز الصور...');for(const f of [...fl]){const im=await fileToImg(f);if(im)T.imgs.push(im)}drawTh();toast('تمام')}
function drawTh(){$('#th').innerHTML=T.imgs.map((s,i)=>`<div><img src="${s.d}" alt="">${i===0?'<span class="cv">غلاف</span>':''}<div class="tb"><button data-i="${i}" data-k="c">غلاف</button><button data-i="${i}" data-k="r">◂</button><button data-i="${i}" data-k="l">▸</button><button data-i="${i}" data-k="x">✕</button></div></div>`).join('')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeEd()});

 const saved=await DB.get('data');D=saved?fix(saved):defD();
 dirH=await DB.get('dir');
 if(dirH){try{perm=(await dirH.queryPermission({mode:'readwrite'}))==='granted'}catch(e){perm=false}}
 status();adm();if(perm)syncNow();
